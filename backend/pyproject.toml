[project]
name = "agentid-aks-backend"
version = "0.1.0"
description = "Backend: AI agent with Entra Agent ID sidecar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "PyJWT[crypto]>=2.9.0",
    "agent-framework-foundry>=1.3.0",
    "azure-identity>=1.19.0",
    "azure-ai-projects>=2.0.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.13.4",
    "aiohttp>=3.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.deptry]
package_module_name_map = { "PyJWT" = "jwt", "agent-framework-foundry" = "agent_framework" }
ignore_notebooks = true

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "sse-starlette", "azure-identity", "azure-ai-projects", "agent-framework-foundry", "aiohttp", "pytest", "pytest-asyncio", "pytest-cov"]
DEP003 = ["starlette", "azure"]
